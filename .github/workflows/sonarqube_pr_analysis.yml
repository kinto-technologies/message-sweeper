name: "SonarQube Pull Request Analysis"

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - "README.md"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "LICENSE"
      - ".github/**"
      - "**/*.md"
      - "docs/**"

jobs:
  SonarQubePullReqAnalysis:
    # A pull request from a fork gets no access to secrets, so the scan would
    # fail for reasons the contributor cannot fix. Skip it there; the branch
    # analysis on main still covers the code once a maintainer lands it.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          fetch-depth: 0

      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          # NVDA 2025.x bundles Python 3.11; match the runtime.
          python-version: "3.11"

      - name: Generate coverage report
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: |
          pip install pytest coverage
          coverage run -m pytest tests/
          coverage xml

      # The add-on manifest is the single source of the version. Passing it to
      # SonarQube gives the "previous version" new-code baseline something to
      # anchor on; without it, every analysis treats the whole tree as new code.
      - name: Read add-on version
        id: addon_version
        run: |
          version=$(sed -nE 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' addon/manifest.ini | head -1)
          if [ -z "$version" ]; then
            echo "Could not read version from addon/manifest.ini" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@aa494459d7c39c106cc77b166de8b4250a32bb97  # v5.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_DEVELOP_ED }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL_DEVELOP_ED }}
        with:
          args: >
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.projectVersion=${{ steps.addon_version.outputs.version }}
