summary = "Message Sweeper - Slack と Teams のメッセージを NVDA で読みやすくする"
description = """Slack や Microsoft Teams のメッセージにフォーカスすると、NVDA はアプリが渡してくる内容をそのまま読み上げます。生の URL、延々と続く絵文字ラベルや全角の装飾、取り残された markdown 記号、そして送信者・本文・時刻・リアクションが追いにくい順序で並びます。Message Sweeper はこの読み上げを組み替えます。URL はリンク先のページタイトルに置き換え、装飾として並んだ絵文字は本文から取り除いて個数だけを別に伝え、markdown と装飾記号を落とし、送信者・本文・リンク・時刻・リアクションの順に読み上げます。同じ整形済みのテキストを点字ディスプレイにも送ります。
取り除くのは連続した並びだけなので、情報として意味のある絵文字（週間予定の1行に1つ、など）はそのまま残ります。ここが、NVDA の記号読み上げレベルを下げる方法との違いです。記号レベルはすべての場面に一律で効き、装飾と内容を区別できません。
処理の有効・無効は切り替えコマンドで行います。既定ではキーが割り当てられていないので、必要なときは NVDA の「入力ジェスチャ」の「Message Sweeper」から割り当ててください。装飾とみなす連続の長さ、絵文字の個数を伝える位置、ページタイトルが取得できなかったときの読み上げは、NVDA の設定の「Message Sweeper」で変更できます。
ページタイトルの取得にはインターネット接続が必要です。Slack Desktop と新しい Microsoft Teams（Windows 11）で動作を確認しています。"""
