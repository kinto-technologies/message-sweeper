name = "messageSweeper"
summary = "Message Sweeper - Clean Slack & Teams messages for NVDA"
description = """When you focus a message in Slack or Microsoft Teams, NVDA reads what the app exposes: raw URLs, long runs of emoji labels and fullwidth decoration, leftover markdown symbols, and the sender, body, time and reactions in an order that is hard to follow. Message Sweeper rewrites that announcement: URLs are replaced with the title of the page they point to, runs of decorative emoji are removed and reported separately as a count, markdown and decoration are stripped, and the message is spoken as sender, body, links, time, reactions. The same cleaned text is sent to a braille display.
Only consecutive runs of emoji are removed, so emoji that carry information - one per line in a weekly schedule, for example - survive. That is the difference from simply lowering NVDA's symbol level, which applies everywhere and cannot tell decoration from content.
Press NVDA+V to turn processing on or off. The run length that counts as decoration, where the emoji summary is announced, and what to say when a page title cannot be fetched are configurable in NVDA's Settings, under Message Sweeper.
Fetching page titles requires an internet connection. Verified with Slack Desktop and the new Microsoft Teams on Windows 11."""
version = "1.0.1"
author = "KINTO Technologies Corporation <message-sweeper@kinto-technologies.com>"
