# SonarQube analysis configuration for kinto-technologies/message-sweeper.
# sonar.projectKey is supplied by CI from the SONAR_PROJECT_KEY secret.
sonar.projectName=message-sweeper
sonar.organization=kinto-technologies

# 分析対象
sonar.sources=addon
sonar.tests=tests

# Python 設定（NVDA 2025+ は Python 3.11 系）
sonar.python.version=3.11

# エンコーディング
sonar.sourceEncoding=UTF-8

# 解析対象から外すパス
sonar.exclusions=**/__pycache__/**,**/*.pyc,**/*.pyo,**/*.mo,**/locale/**/*.po,build/**,dist/**

# カバレッジレポート（CI で coverage.py が coverage.xml を生成する）
sonar.python.coverage.reportPaths=coverage.xml
